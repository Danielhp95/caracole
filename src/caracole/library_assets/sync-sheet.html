<input type="file" id="sync-file" accept=".caracole,.sqlite" hidden>
<dialog class="sync-sheet" id="sync-sheet" aria-labelledby="sync-title">
<div class="grab" aria-hidden="true"></div>
<div class="sync-top">
  <span class="sync-check" id="sync-check" data-icon="check" hidden></span>
  <div class="sync-heads">
    <h2 class="sync-title" id="sync-title"></h2>
    <p class="sync-sub" id="sync-sub"></p>
  </div>
</div>
<ol class="sync-chips" id="sync-chips" aria-label="Where the sync is" hidden></ol>
<ul class="sync-counts" id="sync-counts" aria-label="What it does" hidden>
  <li class="take"><span data-icon="take"></span><b class="n">0</b> <span class="what">to take</span></li>
  <li class="give"><span data-icon="give"></span><b class="n">0</b> <span class="what">to give</span></li>
  <li class="both"><span data-icon="both"></span><b class="n">0</b> <span class="what">changed on both</span></li>
</ul>
<div class="sync-view" id="sync-what">
  <fieldset class="sync-parts" id="sync-parts">
    <legend class="visually-hidden">What to sync</legend>
    <label class="sync-part" data-part="library"><input type="checkbox" name="part" value="library" checked><span
      class="sync-part-words"><span class="sync-part-name">Library</span><span class="sync-part-said"></span></span></label>
    <label class="sync-part" data-part="songbooks"><input type="checkbox" name="part" value="songbooks" checked><span
      class="sync-part-words"><span class="sync-part-name">Songbooks</span><span class="sync-part-said"></span></span></label>
    <label class="sync-part" data-part="indexes"><input type="checkbox" name="part" value="indexes" checked><span
      class="sync-part-words"><span class="sync-part-name">Site indexes</span><span class="sync-part-said"></span></span></label>
  </fieldset>
</div>
<div class="sync-view" id="sync-conflict" hidden>
  <section class="sync-card" id="sync-card" aria-labelledby="sync-card-name">
    <h3 class="sync-card-name" id="sync-card-name"></h3>
    <p class="sync-card-at" id="sync-card-at"></p>
    <div class="sync-two">
      <section class="sync-side" id="sync-card-here"><h4 class="sync-side-head"></h4><dl class="sync-lines"></dl></section>
      <section class="sync-side" id="sync-card-there"><h4 class="sync-side-head"></h4><dl class="sync-lines"></dl></section>
    </div>
    <p class="sync-ask" id="sync-ask">Which version to keep</p>
    <div class="sync-pair" role="group" aria-labelledby="sync-ask">
      <button type="button" class="btn primary" id="sync-keep-here"></button>
      <button type="button" class="btn primary" id="sync-keep-there"></button>
    </div>
    <label class="sync-same" id="sync-same-row"><input type="checkbox" id="sync-same"><span
      id="sync-same-said"></span></label>
  </section>
</div>
<div class="sync-view" id="sync-going" hidden>
  <p class="sync-going-line" id="sync-going-line" role="status" tabindex="-1"></p>
  <p class="sync-going-detail" id="sync-going-detail"></p>
</div>
<div class="sync-view" id="sync-done" hidden>
  <div class="sync-devs" id="sync-devs"></div>
  <div class="sync-sections" id="sync-sections"></div>
  <p class="sync-note" id="sync-file-note" hidden>A file takes nothing back: no "given" arrow. To give your changes,
    export a file of your own.</p>
</div>
<p class="sync-status" id="sync-status" role="status"></p>
<div class="sync-ends">
  <button type="button" class="btn" id="sync-cancel">Cancel</button>
  <button type="button" class="btn primary" id="sync-go">Sync</button>
</div>
</dialog>
<template id="sync-icon-phone"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6.5" y="2.5"
  width="11" height="19" rx="2.2"/><path d="M10.5 18.2h3"/></svg></template>
<template id="sync-icon-tower"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="7" y="2" width="10"
  height="20" rx="1.5"/><path d="M9.5 6h5M9.5 9h5"/><circle class="dot" cx="12" cy="16.5" r="1.4"/></svg></template>
<template id="sync-icon-rack"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3.5"
  width="18" height="7" rx="1.5"/><rect x="3" y="13.5" width="18" height="7" rx="1.5"/><circle class="dot" cx="7" cy="7"
  r="1.2"/><circle class="dot" cx="7" cy="17" r="1.2"/><path d="M11 7h6.5M11 17h6.5"/></svg></template>
<template id="sync-icon-file"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 2.5h8l4.5
  4.5v14.5H6z"/><path d="M14 2.5V7h4.5M9 12h6.5M9 15.5h6.5"/></svg></template>
<template id="sync-icon-export"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 15V3M7 8l5-5
  5 5M4 14v6h16v-6"/></svg></template>
<template id="sync-icon-import"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12M7 10l5
  5 5-5M4 14v6h16v-6"/></svg></template>
<template id="sync-icon-take"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v15M6 13l6 6
  6-6"/></svg></template>
<template id="sync-icon-give"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20V5M6 11l6-6
  6 6"/></svg></template>
<template id="sync-icon-both"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3 2.5 20h19L12
  3zM12 9.5V14"/><circle class="dot" cx="12" cy="17" r="1.2"/></svg></template>
<template id="sync-icon-check"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12"
  r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg></template>
<template id="sync-icon-chevron"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6
  6-6"/></svg></template>
<template id="sync-icon-arrow"><svg viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true"
  focusable="false"><path class="shaft" d="M4 7h92"/><path class="head left" d="M10 1 2 7l8 6"/><path class="head right"
  d="M90 1l8 6-8 6"/></svg></template>
