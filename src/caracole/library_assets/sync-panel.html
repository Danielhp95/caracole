<section class="view sync" id="sync" role="tabpanel" aria-labelledby="tab-sync" hidden>
<h2 class="visually-hidden">Sync</h2>
<div class="sync-panels">
<section class="sync-panel" aria-labelledby="sync-with-head">
  <h3 class="sync-panel-head" id="sync-with-head"><span class="sync-icon" data-icon="rack"></span>Sync with a server</h3>
  <form class="sync-with" id="sync-with">
    <label class="visually-hidden" for="sync-address">Its address, caracole serve's there</label>
    <div class="sync-row">
      <input id="sync-address" name="address" type="text" inputmode="url" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" placeholder="http://192.168.1.20:8737" list="sync-peers">
      <button type="button" class="btn" id="sync-test">Test</button>
    </div>
    <datalist id="sync-peers"></datalist>
  </form>
  <p class="sync-tested" id="sync-tested" role="status"></p>
  <p class="sync-last" id="sync-last"></p>
  <div class="sync-panel-go"><button type="button" class="btn primary" id="sync-start">Sync</button></div>
</section>
<section class="sync-panel" aria-labelledby="sync-export-head">
  <h3 class="sync-panel-head" id="sync-export-head"><span class="sync-icon" data-icon="export"></span>Export</h3>
  <p class="sync-panel-said">This library in one file, for another server or a phone: to share, or to keep.</p>
  <div class="sync-panel-go"><button type="button" class="btn primary" id="sync-export">Export</button></div>
</section>
<section class="sync-panel" aria-labelledby="sync-import-head">
  <h3 class="sync-panel-head" id="sync-import-head"><span class="sync-icon" data-icon="import"></span>Import a file</h3>
  <p class="sync-panel-said">A file a phone or a server exported, synced as if its caracole were here.</p>
  <div class="sync-panel-go"><label class="btn primary" for="sync-file" id="sync-choose">Choose a file</label></div>
</section>
</div>
</section>
