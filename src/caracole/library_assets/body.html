<body class="drawing">
<div class="page">
<header class="masthead lib">
  <p class="app">caracole</p>
  <div class="title-line">
    <h1>Your library</h1>
    <ul class="summary" id="summary" aria-label="The library in numbers"></ul>
  </div>
  __NAV__
</header>
<div class="tabs" role="tablist" aria-label="Your songs, or your songbooks">
  <button type="button" class="tab" role="tab" id="tab-library" aria-controls="library-view"
    aria-selected="true">Library</button>
  <button type="button" class="tab" role="tab" id="tab-songbooks" aria-controls="songbooks" aria-selected="false"
    tabindex="-1">Songbooks <span class="n"></span></button>
</div>
<div class="view" id="library-view" role="tabpanel" aria-labelledby="tab-library">
<div class="bar-edge" id="bar-edge" aria-hidden="true"></div>
<div class="searchbar" role="search">
  <label class="visually-hidden" for="q">Search your songs</label>
  <div class="bar-row">
    <div class="field">
      <input id="q" type="search" placeholder="Artist, title or key" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" enterkeyhint="search" aria-describedby="bar-status">
      <button type="button" id="clear" class="clear" aria-label="Clear the search" hidden>×</button>
    </div>
  </div>
  <p class="bar-status" id="bar-status" aria-live="polite"></p>
</div>
__REQUESTED__<section class="results" id="results" aria-label="Search results">
<div class="found" id="found" hidden></div>
__REQUEST__</section>
<div class="toolbar">
  <div class="chips" role="group" aria-label="Show">
    <button type="button" class="chip" data-show="all" aria-pressed="true">All <span class="n"></span></button>
    <button type="button" class="chip" data-show="found" aria-pressed="false">Found <span class="n"></span></button>
    <button type="button" class="chip" data-show="wanted" aria-pressed="false">Wanted <span class="n"></span></button>
    <button type="button" class="chip" data-show="review" aria-pressed="false">Needs review <span class="n"></span></button>
    <button type="button" class="chip person" id="artist" hidden></button>
  </div>
  <div class="controls">
    <label class="sort" id="keys" hidden>Key
      <select id="key"><option value="">Any</option></select>
    </label>
    <label class="sort">Sort
      <select id="sort">
        <option value="artist">Artist A–Z</option>
        <option value="title">Title A–Z</option>
        <option value="recent">Recently added</option>
      </select>
    </label>
  </div>
</div>
<p class="prog-filter" id="prog" aria-live="polite" hidden></p>
<nav class="jump" id="jump" aria-label="Jump to a letter" hidden></nav>
<p class="count" id="count" aria-live="polite"></p>
<main class="list" id="list"></main>
<noscript><p class="empty">This page needs JavaScript to list your songs and songbooks. Each song's files are in its
  folder, and each songbook's in _songbooks/, next to this page.</p></noscript>
</div>
<section class="view books" id="songbooks" role="tabpanel" aria-labelledby="tab-songbooks" hidden></section>
<template id="guitar-glyph"><svg viewBox="1.5 1.5 21 21" aria-hidden="true" focusable="false"><path
  transform="rotate(40 12 12)" d="M10.3 1.4Q10.3.9 10.8 .9H13.2Q13.7.9 13.7 1.4V4.2H10.3ZM11 4.2H13V9.9H11Z
  M9.08 14.74A3.4 3.4 0 1 1 14.92 14.74A4.6 4.6 0 1 1 9.08 14.74Z
  M13.45 15.4A1.45 1.45 0 1 0 10.55 15.4A1.45 1.45 0 1 0 13.45 15.4ZM10.2 19.3V20.2H13.8V19.3Z"/></svg></template>
<footer class="footer"><span id="updated"></span>Keep this library private: the sheets and lyrics are other
  people's work.</footer>
</div>
