<body class="drawing">
<div class="page">
<header class="masthead lib">
  <h1 class="visually-hidden">Your library</h1>
  <p class="app">__MARK__<span class="word">caracole</span></p>
  <div class="tabs" role="tablist" aria-label="Your songs, or your songbooks">
    <button type="button" class="tab" role="tab" id="tab-library" aria-controls="library-view"
      aria-selected="true">Library</button>
    <button type="button" class="tab" role="tab" id="tab-songbooks" aria-controls="songbooks" aria-selected="false"
      tabindex="-1">Songbooks <span class="n"></span></button>
  </div>
  <ul class="summary" id="summary" aria-label="What needs attention"></ul>
  __NAV__
</header>
<div class="view" id="library-view" role="tabpanel" aria-labelledby="tab-library">
<div class="bar-edge" id="bar-edge" aria-hidden="true"></div>
<div class="searchbar" role="search">
  <label class="visually-hidden" for="q">Search your songs</label>
  <div class="bar-row">
    <div class="field">
      <input id="q" type="search" placeholder="Search your songs" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" enterkeyhint="search" aria-describedby="bar-status">
      <button type="button" id="clear" class="clear" aria-label="Clear the search" hidden>×</button>
    </div>
    <div class="tools" id="tools">
      <button type="button" class="tool" id="filter" aria-expanded="false" aria-controls="filter-panel">Filter <span
        class="filter-n" id="filter-count" hidden></span></button>
      <label class="tool-menu"><span class="visually-hidden">Sort</span>
        <select id="sort" class="tool">
          <option value="artist">Artist A–Z</option>
          <option value="title">Title A–Z</option>
          <option value="recent">Recently added</option>
        </select>
      </label>
    </div>
  </div>
  <p class="bar-status" id="bar-status" aria-live="polite"></p>
</div>
__REQUESTED__<section class="results" id="results" aria-label="Search results">
<div class="found" id="found" hidden></div>
__REQUEST__</section>
<div class="toolbar">
  <div class="tags" id="tags" role="group" aria-label="Filters on">
    <button type="button" class="tag person" id="artist" hidden></button>
    <button type="button" class="clear-filters" id="clear-filters" aria-label="Clear every filter (the search stays)"
      hidden>Clear</button>
  </div>
  <dialog class="filter-panel" id="filter-panel" aria-label="Filter your songs">
    <div class="grab" aria-hidden="true"></div>
    <div class="fsec">
      <p class="fhead" id="f-status">Status</p>
      <div class="seg" role="radiogroup" aria-labelledby="f-status">
        <button type="button" role="radio" data-show="all" aria-checked="true">All <span class="n"></span></button>
        <button type="button" role="radio" data-show="found" aria-checked="false" tabindex="-1">Found <span
          class="n"></span></button>
        <button type="button" role="radio" data-show="wanted" aria-checked="false" tabindex="-1">Wanted <span
          class="n"></span></button>
        <button type="button" role="radio" data-show="review" aria-checked="false" tabindex="-1">Review <span
          class="n"></span></button>
      </div>
    </div>
    <div class="fsec" id="f-insts" hidden>
      <p class="fhead" id="f-inst">Has something for <em>any of these</em></p>
      <div class="fchips" role="group" aria-labelledby="f-inst">
        <button type="button" class="fchip" data-inst="sheet" aria-pressed="false">Chord sheet <span
          class="n"></span></button>
        <button type="button" class="fchip" data-inst="guitar" aria-pressed="false">Guitar tab <span
          class="n"></span></button>
        <button type="button" class="fchip" data-inst="ukulele" aria-pressed="false">Ukulele <span
          class="n"></span></button>
        <button type="button" class="fchip" data-inst="harmonica" aria-pressed="false">Harmonica <span
          class="n"></span></button>
        <button type="button" class="fchip" data-inst="score" aria-pressed="false">Score <span class="n"></span></button>
      </div>
    </div>
    <div class="fsec" id="keys" hidden>
      <p class="fhead" id="f-key">Key</p>
      <div class="seg" role="radiogroup" aria-labelledby="f-key">
        <button type="button" role="radio" data-mode="" aria-checked="true">Any</button>
        <button type="button" role="radio" data-mode="major" aria-checked="false" tabindex="-1">Major</button>
        <button type="button" role="radio" data-mode="minor" aria-checked="false" tabindex="-1">Minor</button>
      </div>
      <div class="tonics" id="tonics" role="group" aria-label="Tonic"></div>
    </div>
    <div class="ffoot">
      <button type="button" class="clear-all" id="clear-all">Clear all</button>
      <span class="live" id="filter-live"></span>
      <button type="button" class="btn primary show-n" id="show-n"></button>
    </div>
  </dialog>
</div>
<p class="prog-filter" id="prog" aria-live="polite" hidden></p>
<nav class="jump" id="jump" aria-label="Jump to a letter" hidden></nav>
<p class="count" id="count" aria-live="polite"></p>
<main class="list" id="list"></main>
<noscript><p class="empty">This page needs JavaScript to list your songs and songbooks. Each song's files are in its
  folder, and each songbook's in _songbooks/, next to this page.</p></noscript>
</div>
<section class="view books" id="songbooks" role="tabpanel" aria-labelledby="tab-songbooks" hidden></section>
<template id="guitar-glyph"><svg viewBox="1.5 1.5 21 21" aria-hidden="true" focusable="false"><path
  transform="rotate(40 12 12)" d="M10.3 1.4Q10.3.9 10.8 .9H13.2Q13.7.9 13.7 1.4V4.2H10.3ZM11 4.2H13V9.9H11Z
  M9.08 14.74A3.4 3.4 0 1 1 14.92 14.74A4.6 4.6 0 1 1 9.08 14.74Z
  M13.45 15.4A1.45 1.45 0 1 0 10.55 15.4A1.45 1.45 0 1 0 13.45 15.4ZM10.2 19.3V20.2H13.8V19.3Z"/></svg></template>
<footer class="footer"><span id="updated"></span>Keep this library private: the sheets and lyrics are other
  people's work.</footer>
</div>
