org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The machine is shared: at most four workers a build.
org.gradle.workers.max=4
# Lint's K2 UAST (AGP 8.13.2's lint) crashes reading a build script's top-level properties
# ("findFirCompiledSymbol only works on compiled declarations", SymbolLightClassForScript.getOwnFields), which fails
# assembleRelease's lintVital; its K1 UAST reads them.
android.lint.useK2Uast=false
