org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The machine is shared: at most four workers a build.
org.gradle.workers.max=4
# Lint's K2 UAST (AGP 8.13.2's lint) crashes reading a build script's top-level properties
# ("findFirCompiledSymbol only works on compiled declarations", SymbolLightClassForScript.getOwnFields), which fails
# assembleRelease's lintVital; its K1 UAST reads them.
android.lint.useK2Uast=false
# The owner's rule of 2026-11-27: "Ensure that emulators are properly killed when using them for testing or
# development. same thing for gradle biuld and adb servers." A daemon idle for two minutes stops (Gradle's default is
# three hours): the builds of one task, a minute or two apart, still reuse it, and none lingers after. The Kotlin
# compile daemon needs nothing of its own: it ends within seconds of the Gradle daemon that started it (its
# initiator's marker file goes with that JVM), where its own idle shutdown is two hours.
org.gradle.daemon.idletimeout=120000
