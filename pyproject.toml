[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caracole"
version = "0.1.0"
description = "Nightly builder of a private library of sing-along chord sheets, lyrics and guitar parts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx",
  "selectolax",
  "rapidfuzz",
  "spotipy",
  "typer",
  "mutagen",
  "tomlkit",
  "pypinyin",
]

[project.urls]
Homepage = "https://github.com/Danielhp95/caracole"
Repository = "https://github.com/Danielhp95/caracole"

[project.optional-dependencies]
autochords = ["torch", "torchaudio", "beat-this", "librosa", "numpy", "scipy", "soundfile", "pyyaml"]

[project.scripts]
caracole = "caracole.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caracole"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
# tmp_path is in memory (tests/conftest.py): keep only the folders of tests that failed.
tmp_path_retention_policy = "failed"
filterwarnings = ["ignore::DeprecationWarning:pypinyin.*"]
markers = [
  "chordpro: needs the chordpro binary on PATH (and is slow)",
  "autochords: needs torch, beat-this and librosa",
  "slow: a real browser, chordpro or another process; the quick loop is -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
