[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabarr"
version = "0.1.0"
description = "Nightly builder of a private library of sing-along chord sheets, lyrics and guitar parts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx",
  "selectolax",
  "rapidfuzz",
  "spotipy",
  "typer",
  "mutagen",
  "tomlkit",
  "pypinyin",
]

[project.optional-dependencies]
autochords = ["torch", "beat-this", "librosa", "numpy", "scipy", "soundfile", "pyyaml"]

[project.scripts]
tabarr = "tabarr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tabarr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:pypinyin.*"]
markers = [
  "chordpro: needs the chordpro binary on PATH",
  "autochords: needs torch, beat-this and librosa",
]

[tool.ruff]
line-length = 100
target-version = "py312"
